<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1a1a18; --ink2:#4a4a46; --ink3:#8a8a84;
    --paper:#f7f5f0; --rule:#d4d2c8; --accent:#c0392b;
    --blue:#1a3a5c; --blue-bg:#edf2f7;
    --green:#1a4a1a; --green-bg:#edf7ed;
    --amber:#5a3e00; --amber-bg:#fdf6e3;
    --purple:#3a1a5c; --purple-bg:#f0edf7;
    --teal:#0a3a32; --teal-bg:#edf7f5;
    --red:#5c1a1a; --red-bg:#fdecea;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; min-height:100vh; }

  .masthead { border-bottom:3px double var(--rule); padding:1.5rem 0 1rem; text-align:center; }
  .eyebrow { font-size:10px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); margin-bottom:.4rem; }
  .masthead h1 { font-family:'Libre Baskerville',serif; font-size:clamp(2rem,5vw,3.2rem); font-weight:700; letter-spacing:-.02em; line-height:1; }
  .masthead-meta { display:flex; align-items:center; justify-content:center; gap:1.5rem; margin-top:.75rem; font-size:11px; color:var(--ink3); font-weight:300; }
  .dot { width:3px; height:3px; border-radius:50%; background:var(--rule); display:inline-block; }

  .container { max-width:760px; margin:0 auto; padding:0 1.25rem; }

  .controls { padding:1rem 0; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .clabel { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); white-space:nowrap; }
  .chip { font-size:11px; padding:3px 10px; border-radius:2px; border:1px solid var(--rule); background:transparent; color:var(--ink3); cursor:pointer; transition:all .15s; user-select:none; }
  .chip.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .chip.restricted { border-color:var(--blue); color:var(--blue); }
  .chip.restricted.on { background:var(--blue); border-color:var(--blue); color:#fff; }

  .refresh-bar { padding:.85rem 0; border-bottom:1px solid var(--rule); display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .refresh-btn { font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; padding:6px 18px; background:var(--accent); color:#fff; border:none; border-radius:2px; cursor:pointer; transition:opacity .15s; display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .refresh-btn:hover { opacity:.88; }
  .refresh-btn:disabled { opacity:.4; cursor:not-allowed; }
  .status { font-size:11px; color:var(--ink3); font-style:italic; font-family:'Libre Baskerville',serif; }

  .progress-bar { height:2px; background:var(--rule); overflow:hidden; display:none; }
  .progress-fill { height:100%; background:var(--accent); width:0%; transition:width .4s ease; }

  .feed { padding:.5rem 0 3rem; }

  .sec-head { display:flex; align-items:baseline; gap:.75rem; padding:1.25rem 0 .5rem; border-top:2px solid var(--ink); margin-top:1.5rem; flex-wrap:wrap; }
  .sec-head:first-child { margin-top:.5rem; border-top-width:3px; }
  .sec-name { font-family:'Libre Baskerville',serif; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .sec-badge { font-size:9px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:2px; background:var(--blue-bg); color:var(--blue); }
  .sec-sources { font-size:10px; color:var(--ink3); margin-left:auto; font-style:italic; font-family:'Libre Baskerville',serif; }

  .article { padding:.9rem 0; border-bottom:1px solid var(--rule); display:grid; grid-template-columns:1fr auto; gap:0 1rem; align-items:start; }
  .article:last-child { border-bottom:none; }
  .art-left { min-width:0; }
  .art-meta { font-size:10px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin-bottom:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .art-title { font-family:'Libre Baskerville',serif; font-size:15px; font-weight:700; line-height:1.35; color:var(--ink); text-decoration:none; display:block; margin-bottom:5px; transition:color .12s; }
  .art-title:hover { color:var(--accent); }
  .art-summary { font-size:12.5px; color:var(--ink2); line-height:1.55; font-family:'Libre Baskerville',serif; }
  .art-time { font-size:10px; color:var(--ink3); white-space:nowrap; padding-top:2px; font-weight:300; }

  .tag { font-size:9px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; padding:1px 6px; border-radius:2px; }
  .tag-president { background:var(--blue-bg); color:var(--blue); }
  .tag-iran      { background:var(--red-bg);    color:var(--red);    }
  .tag-economy   { background:var(--green-bg);  color:var(--green);  }
  .tag-layoffs   { background:var(--amber-bg);  color:var(--amber);  }
  .tag-inflation { background:var(--amber-bg);  color:var(--amber);  }
  .tag-ai        { background:var(--purple-bg); color:var(--purple); }
  .tag-local     { background:var(--teal-bg);   color:var(--teal);   }

  .state { padding:3rem 0; text-align:center; color:var(--ink3); font-family:'Libre Baskerville',serif; font-style:italic; font-size:14px; }
  .no-items { padding:.75rem 0; font-size:12px; color:var(--ink3); font-style:italic; font-family:'Libre Baskerville',serif; }
  .spinner { display:inline-block; width:13px; height:13px; border:2px solid var(--rule); border-top-color:var(--ink2); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }

  footer { border-top:3px double var(--rule); padding:1rem 0; text-align:center; font-size:10px; color:var(--ink3); letter-spacing:.06em; font-weight:300; }

  @media(max-width:540px) {
    .masthead h1 { font-size:2rem; }
    .sec-sources { display:none; }
    .article { grid-template-columns:1fr; }
    .art-time { margin-top:4px; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="container">
    <div class="eyebrow">Personal news briefing</div>
    <h1>The Daily Brief</h1>
    <div class="masthead-meta">
      <span id="date-out"></span>
      <span class="dot"></span>
      <span id="time-out"></span>
      <span class="dot"></span>
      <span>Upstate SC &amp; WNC</span>
    </div>
  </div>
</div>

<div class="container">
  <div class="controls">
    <span class="clabel">Topics</span>
    <div class="chip restricted on" data-topic="president" onclick="toggle(this)">US President</div>
    <div class="chip on" data-topic="iran"      onclick="toggle(this)">US–Iran</div>
    <div class="chip on" data-topic="economy"   onclick="toggle(this)">Economy</div>
    <div class="chip on" data-topic="layoffs"   onclick="toggle(this)">Layoffs</div>
    <div class="chip on" data-topic="inflation" onclick="toggle(this)">Inflation</div>
    <div class="chip on" data-topic="ai"        onclick="toggle(this)">AI</div>
    <div class="chip on" data-topic="local"     onclick="toggle(this)">Local</div>
  </div>
  <div class="refresh-bar">
    <button class="refresh-btn" id="btn" onclick="fetchFeed()">
      <span id="btn-label">Load briefing</span>
    </button>
    <span class="status" id="status">Live RSS · multiple sources</span>
  </div>
  <div class="progress-bar" id="prog-bar">
    <div class="progress-fill" id="prog-fill"></div>
  </div>
  <div class="feed" id="feed">
    <div class="state">Press <em>Load briefing</em> to fetch your feed.</div>
  </div>
</div>

<footer><div class="container">The Daily Brief &mdash; personal edition</div></footer>

<script>
// ── Clock ─────────────────────────────────────────────────────────────────────
(function tick() {
  const n = new Date();
  document.getElementById('date-out').textContent =
    n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('time-out').textContent =
    n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  setTimeout(tick, 30000);
})();

// ── CORS proxy chain ──────────────────────────────────────────────────────────
// Try each proxy in order until one returns valid XML
const PROXIES = [
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

async function fetchWithFallback(url) {
  for (const makeProxy of PROXIES) {
    try {
      const res = await fetch(makeProxy(url), { signal: AbortSignal.timeout(10000) });
      if (!res.ok) continue;
      const text = await res.text();
      // Verify we actually got XML feed content
      if (text && (text.includes('<rss') || text.includes('<feed') || text.includes('<item') || text.includes('<entry'))) {
        return text;
      }
    } catch(e) {
      // Try next proxy
    }
  }
  return null;
}

// ── RSS/Atom XML parser ───────────────────────────────────────────────────────
function parseXML(xmlStr) {
  try {
    const doc = new DOMParser().parseFromString(xmlStr, 'text/xml');
    const items = [...doc.querySelectorAll('item, entry')];
    return items.map(el => {
      const txt = tag => {
        const node = el.querySelector(tag);
        return node ? (node.textContent || '').trim() : '';
      };
      // Link: try href attr first (Atom), then text content, then guid
      let link = '';
      const lel = el.querySelector('link');
      if (lel) link = lel.getAttribute('href') || lel.textContent.trim();
      if (!link) link = txt('guid') || txt('id');
      // For Google News the real URL is in the guid
      const guid = txt('guid');
      if (guid && guid.startsWith('http')) link = guid;

      return {
        title:       txt('title'),
        link,
        pubDate:     txt('pubDate') || txt('published') || txt('updated'),
        description: txt('description') || txt('summary') || txt('content'),
        author:      txt('source') || txt('author name') || txt('dc\\:creator') || txt('author'),
      };
    });
  } catch(e) { return []; }
}

// ── Topic definitions ─────────────────────────────────────────────────────────
// Google News RSS — reliable search-based feeds, no dead URLs
const GN = 'https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=';
const WIRES = '(source:reuters.com OR source:apnews.com OR source:axios.com OR source:bbc.com OR source:npr.org OR source:politico.com)';

const TOPICS = {
  president: {
    label: 'US President & Administration',
    tag: 'tag-president', restricted: true, badge: 'Verified sources only',
    sources: 'AP · Reuters · Axios · BBC · NPR · Politico',
    feeds: [
      GN + encodeURIComponent('Trump White House policy executive order ' + WIRES + ' when:2d'),
      GN + encodeURIComponent('US president administration federal ' + WIRES + ' when:2d'),
    ]
  },
  iran: {
    label: 'US–Iran Conflict',
    tag: 'tag-iran', restricted: false,
    sources: 'Reuters · AP · BBC · Al Jazeera · Defense One · FT',
    feeds: [
      GN + encodeURIComponent('Iran US military naval Gulf Hormuz when:3d'),
      GN + encodeURIComponent('Iran nuclear diplomacy sanctions oil supply when:3d'),
      GN + encodeURIComponent('Iran Israel Saudi proxy Houthi when:3d'),
    ]
  },
  economy: {
    label: 'Economy',
    tag: 'tag-economy', restricted: false,
    sources: 'WSJ · Bloomberg · Reuters · AP · CNBC',
    feeds: [
      GN + encodeURIComponent('US economy recession Federal Reserve GDP jobs when:2d'),
      GN + encodeURIComponent('markets earnings trade tariffs fiscal when:2d'),
      GN + encodeURIComponent('tech startup venture capital IPO funding when:3d'),
    ]
  },
  layoffs: {
    label: 'Layoffs',
    tag: 'tag-layoffs', restricted: false,
    sources: 'TechCrunch · Bloomberg · Reuters · The Verge',
    feeds: [
      GN + encodeURIComponent('layoffs job cuts workforce reduction 2026 when:7d'),
      GN + encodeURIComponent('tech company employees laid off restructuring when:7d'),
    ]
  },
  inflation: {
    label: 'Inflation',
    tag: 'tag-inflation', restricted: false,
    sources: 'Reuters · AP · Bloomberg · WSJ',
    feeds: [
      GN + encodeURIComponent('inflation CPI consumer prices 2026 when:7d'),
      GN + encodeURIComponent('food energy grocery prices tariffs cost living when:7d'),
    ]
  },
  ai: {
    label: 'AI News',
    tag: 'tag-ai', restricted: false,
    sources: 'TechCrunch · The Verge · Ars Technica · Reuters · MIT Tech Review',
    feeds: [
      GN + encodeURIComponent('artificial intelligence AI model OpenAI Anthropic Google when:3d'),
      GN + encodeURIComponent('AI regulation policy enterprise chip Nvidia when:3d'),
    ]
  },
  local: {
    label: 'Local — Upstate SC & WNC',
    tag: 'tag-local', restricted: false,
    sources: 'WSPA · FOX Carolina · WLOS · Post & Courier · WYFF4',
    feeds: [
      'https://www.wspa.com/feed/',
      'https://www.foxcarolina.com/feed/',
      'https://wlos.com/feed/',
      'https://greenvillejournal.com/feed/',
      'https://www.wyff4.com/topstories-rss',
    ]
  }
};

// ── State ─────────────────────────────────────────────────────────────────────
let active = new Set(Object.keys(TOPICS));
let busy = false;

function toggle(el) {
  const t = el.dataset.topic;
  if (active.has(t)) {
    if (active.size === 1) return;
    active.delete(t);
    el.classList.remove('on');
  } else {
    active.add(t);
    el.classList.add('on');
  }
}

// ── Utility ───────────────────────────────────────────────────────────────────
function clean(s) {
  if (!s) return '';
  return s.replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<')
          .replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#039;/g,"'")
          .replace(/\s+/g,' ').trim();
}

function ago(d) {
  if (!d) return '';
  try {
    const s = (Date.now() - new Date(d)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s/60) + 'm ago';
    if (s < 86400) return Math.round(s/3600) + 'h ago';
    return Math.round(s/86400) + 'd ago';
  } catch(e) { return ''; }
}

function oneSentence(raw) {
  if (!raw) return '';
  const s = clean(raw);
  const m = s.match(/^.{25,240}?[.!?](?:\s|$)/);
  return m ? m[0].trim() : s.substring(0,180).trim() + (s.length > 180 ? '…' : '');
}

function setProgress(pct) {
  document.getElementById('prog-fill').style.width = pct + '%';
}

// ── Main fetch ────────────────────────────────────────────────────────────────
async function fetchFeed() {
  if (busy) return;
  busy = true;

  const btn = document.getElementById('btn');
  document.getElementById('btn-label').innerHTML = '<span class="spinner"></span> Fetching…';
  btn.disabled = true;
  document.getElementById('feed').innerHTML = '<div class="state">Gathering headlines…</div>';
  document.getElementById('prog-bar').style.display = 'block';
  setProgress(3);

  const keys = Array.from(active);

  // Build flat list of all feed requests
  const allFeeds = [];
  keys.forEach(key => {
    TOPICS[key].feeds.forEach(url => allFeeds.push({ key, url }));
  });

  // Fetch one at a time — simple, reliable, avoids rate limit issues entirely
  const collected = {};
  keys.forEach(k => { collected[k] = []; });

  for (let i = 0; i < allFeeds.length; i++) {
    const { key, url } = allFeeds[i];
    const xml = await fetchWithFallback(url);
    if (xml) {
      const items = parseXML(xml);
      collected[key] = collected[key].concat(items);
    }
    setProgress(Math.round(5 + 90 * ((i + 1) / allFeeds.length)));
  }

  setProgress(100);

  // Render
  let html = '';
  let total = 0;

  keys.forEach(key => {
    const t = TOPICS[key];
    const items = collected[key];

    // Deduplicate by title
    const seen = new Set();
    const uniq = [];
    for (const item of items) {
      const k = clean(item.title || '').substring(0, 55).toLowerCase();
      if (k && !seen.has(k)) { seen.add(k); uniq.push(item); }
    }

    // Sort newest first
    uniq.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));
    const top = uniq.slice(0, 6);
    total += top.length;

    html += `<div class="sec-head">
      <span class="sec-name">${t.label}</span>
      ${t.restricted ? `<span class="sec-badge">${t.badge}</span>` : ''}
      <span class="sec-sources">${t.sources}</span>
    </div>`;

    if (!top.length) {
      html += `<p class="no-items">No recent headlines loaded for this topic.</p>`;
    } else {
      top.forEach(item => {
        const title   = clean(item.title || '');
        const summary = oneSentence(item.description || '');
        const link    = item.link || '#';
        const when    = ago(item.pubDate);
        const pub     = clean(item.author || '');

        html += `<div class="article">
          <div class="art-left">
            <div class="art-meta">
              ${pub ? `<span>${pub}</span><span style="color:var(--rule)">·</span>` : ''}
              <span class="tag ${t.tag}">${t.label}</span>
            </div>
            <a class="art-title" href="${link}" target="_blank" rel="noopener">${title}</a>
            ${summary ? `<p class="art-summary">${summary}</p>` : ''}
          </div>
          <div class="art-time">${when}</div>
        </div>`;
      });
    }
  });

  setTimeout(() => { document.getElementById('prog-bar').style.display = 'none'; }, 500);
  document.getElementById('feed').innerHTML = html || '<div class="state">No results.</div>';
  document.getElementById('status').textContent =
    `Updated ${new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})} · ${total} headlines`;

  busy = false;
  btn.disabled = false;
  document.getElementById('btn-label').textContent = 'Refresh';
}
</script>
</body>
</html>
